name: Supabase heartbeat

on:
  schedule:
    - cron: "0 9 * * *" # Every 3 days at 9am UTC
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X PATCH "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"last_ping": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
